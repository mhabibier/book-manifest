apiVersion: v1
kind: Service
metadata:
  name: book-service
  namespace: book-service
  labels:
    app.kubernetes.io/name:      book-microservice
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app: book-service
  ports:
    - name:       http
      port:       80
      targetPort: http
      protocol:   TCP