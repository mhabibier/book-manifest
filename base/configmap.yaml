# k8s/base/configmap.yaml
# Non-sensitive configuration for book-service.
# Sensitive values go in secret.yaml.

apiVersion: v1
kind: ConfigMap
metadata:
  name: book-service-config
  namespace: book-service
  labels:
    app.kubernetes.io/name:      book-microservice
    app.kubernetes.io/component: config
data:
  PORT:            "8000"
  NODE_ENV:        "production"
  SERVICE_NAME:    "book-service"
  SERVICE_VERSION: "1.0.0"

  # MinIO / S3
  # S3_ENDPOINT: internal MinIO service URL in your cluster
  # Format: http://<service>.<namespace>.svc.cluster.local:<port>
  S3_ENDPOINT:    "http://minio.minio.svc.cluster.local:9000"
  S3_BUCKET:      "books"
  S3_REGION:      "us-east-1"
  # S3_PUBLIC_URL: how clients reach MinIO from the outside
  # If MinIO is behind an Ingress or NodePort, use that URL
  S3_PUBLIC_URL:  "http://minio.yourdomain.com"

  # Observability — update to match your monitoring stack namespace
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.monitoring.svc.cluster.local:4317"
  LOKI_HOST:                   "http://loki.monitoring.svc.cluster.local:3100"