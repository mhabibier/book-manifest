# ConfigMap for Book Microservice

apiVersion: v1
kind: ConfigMap
metadata:
  name: book-service-config
  namespace: book-service
  labels:
    app.kubernetes.io/name:      book-microservice
    app.kubernetes.io/component: config
data:
  PORT:            "3000"
  NODE_ENV:        "production"
  SERVICE_NAME:    "book-service"
  SERVICE_VERSION: "1.0.0"
  S3_ENDPOINT:    "http://minio.minio.svc.cluster.local:9000"
  S3_BUCKET:      "books"
  S3_REGION:      "us-east-1"
  S3_PUBLIC_URL:  "http://minio.yourdomain.com"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.alloy.svc.cluster.local:4317"
  LOKI_HOST:                   "http://loki.loki.svc.cluster.local:3100"
  CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:8081"