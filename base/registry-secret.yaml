# k8s/base/registry-secret.yaml
# Docker credentials for pulling from private registry.
#
# Create imperatively (recommended):
#   kubectl create secret docker-registry registry-credentials \
#     --namespace book-service \
#     --docker-server=registry.yourdomain.com \
#     --docker-username=your-username \
#     --docker-password=your-password

apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: book-service
  labels:
    app.kubernetes.io/name:      book-microservice
    app.kubernetes.io/component: registry-secret
type: kubernetes.io/dockerconfigjson
